name: tests

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used. The token is read-only and not kept after checkout.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - run: docker build -t ai-police-sandbox:1 sandbox
      - run: python validate.py
      - run: python -m pytest tests_harness -q
